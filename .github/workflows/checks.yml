name: checks

# Repository checks: catalog and file hygiene, and re-runs of the scripts that need only files in this repository.
# Run the same locally with `python3 ci/lint.py` and `bash ci/reproduce.sh` (see CONTRIBUTING.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Catalog, JSON, syntax, output paths
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 ci/lint.py

  reproduce-r:
    name: Re-run R scripts on bundled files
    runs-on: ubuntu-24.04
    # Plain Ubuntu 24.04 packages: R 4.3.3 and limma 3.58.1, the versions the bundled outputs were made with
    container: ubuntu:24.04
    steps:
      - name: Install R, data.table, limma, sva, bladderbatch, survival, maxstat, edgeR, DESeq2 and git
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends r-base-core r-cran-data.table r-bioc-limma r-bioc-sva r-bioc-bladderbatch \
            r-cran-survival r-cran-maxstat r-bioc-edger r-bioc-deseq2 git ca-certificates
      - uses: actions/checkout@v5
      # actions/checkout marks the workspace as safe only in its own step's HOME; in a container job, git in later steps
      # then refuses the checkout because another user owns it ("dubious ownership"), so mark it again here
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash ci/reproduce.sh r

  reproduce-python:
    name: Re-run Python scripts on bundled files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet numpy pandas matplotlib
      - run: bash ci/reproduce.sh python

  pipelines:
    name: Pipelines on synthetic data
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Install quantifiers (Salmon, kallisto, STAR, subread, RSEM), R with data.table, Python and git
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends salmon kallisto rna-star subread rsem r-base-core r-cran-data.table python3 git ca-certificates
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash ci/reproduce.sh pipelines

  microbiome:
    name: Microbiome DA study (pinned conda environment)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Create the conda environment from the lock file
        # (the runner context is not available in job-level env, so the prefix is set here from $RUNNER_TEMP)
        run: |
          export MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba-root"
          curl -fsSL -o "$RUNNER_TEMP/micromamba.tar.bz2" https://conda.anaconda.org/conda-forge/linux-64/micromamba-2.10.0-0.tar.bz2
          mkdir -p "$RUNNER_TEMP/mm"
          tar -xjf "$RUNNER_TEMP/micromamba.tar.bz2" -C "$RUNNER_TEMP/mm" bin/micromamba
          "$RUNNER_TEMP/mm/bin/micromamba" create -y -q -p "$RUNNER_TEMP/da-env" --file microbiome-da-methods/conda-linux-64.lock
      - run: DA_RSCRIPT="$RUNNER_TEMP/da-env/bin/Rscript" DA_CORES=4 bash ci/reproduce.sh microbiome

  doublets:
    name: Doublet pipeline on synthetic data (pinned conda environment)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Create the conda environment from the lock file
        run: |
          export MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba-root"
          curl -fsSL -o "$RUNNER_TEMP/micromamba.tar.bz2" https://conda.anaconda.org/conda-forge/linux-64/micromamba-2.10.0-0.tar.bz2
          mkdir -p "$RUNNER_TEMP/mm"
          tar -xjf "$RUNNER_TEMP/micromamba.tar.bz2" -C "$RUNNER_TEMP/mm" bin/micromamba
          "$RUNNER_TEMP/mm/bin/micromamba" create -y -q -p "$RUNNER_TEMP/dbl-env" --file scrna-doublets/conda-linux-64.lock
      - run: DBL_RSCRIPT="$RUNNER_TEMP/dbl-env/bin/Rscript" DBL_PYTHON="$RUNNER_TEMP/dbl-env/bin/python3" bash ci/reproduce.sh doublets
